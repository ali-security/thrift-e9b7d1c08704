# sealed-libraries: the upstream Travis matrix runs build/docker/refresh.sh,
# which rebuilds a giant multi-language docker image and never finishes within
# the sealing harness budget, and none of its jobs cover the Go module.
# This config instead runs the project's Go library suite, mirroring
# lib/go/Makefile.am `check-local` (`go test -race ./thrift`).
# `./lib/go/...` resolves to package lib/go/thrift (lib/go/test and
# lib/go/test/fuzz are nested modules). One leg without and one with -race.

os: linux
dist: focal
language: minimal

env:
  global:
    - GO_VERSION=1.25.0
  jobs:
    - GO_TEST_FLAGS=""
    - GO_TEST_FLAGS="-race"

install:
  - mkdir -p "$HOME/go-dist"
  - curl -fsSL "https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C "$HOME/go-dist"
  - export PATH="$HOME/go-dist/go/bin:$PATH"
  - go version

# go test prints no total, so tee the verbose output and print a pass/fail count.
script:
  - set -o pipefail && go test -v $GO_TEST_FLAGS ./lib/go/... 2>&1 | tee "$HOME/go-test.log"
  - echo "Go test summary - passed $(grep -cE '^ *--- PASS' "$HOME/go-test.log"), failed $(grep -cE '^ *--- FAIL' "$HOME/go-test.log"), skipped $(grep -cE '^ *--- SKIP' "$HOME/go-test.log")"
